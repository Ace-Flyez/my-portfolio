<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Flyez</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <nav class="navbar">
    <div class="container">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">Learn More</a></li>
        <li><a href="services.html">View My Work</a></li>
        <li><a href="testimonials.html">Reviews</a></li>
      </ul>
    </div>
  </nav>

  <main>

    <header class="page-header">
      <div class="container">
        <h1>Get in Touch</h1>
        <p>
          Do you have a project in mind or just want to connect? I'd love to hear from you.
        </p>
      </div>
    </header>

    <section class="section">

      <div class="container">

        <div class="card">

          <form class="contact-form">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="What do you want to say?"></textarea>

            <div class="button-group">
              <button class="btn" type="submit">Send Message</button>
            </div>

          </form>

        </div>

      </div>

    </section>

  </main>

</body>
</html>

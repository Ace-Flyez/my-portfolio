  <main>

    <header class="page-header">
      <div class="container">
        <h1>Get in Touch</h1>
        <p>
          Do you have a project in mind or just want to connect? I'd love to hear from you.
        </p>
      </div>
    </header>

    <section class="section">

      <div class="container">

        <div class="card">

          <form
            class="contact-form"
            action="https://formspree.io/f/xqpkvgad"
            method="POST"
          >

            <input type="hidden" name="_subject" value="New Flyez portfolio enquiry">

            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              autocomplete="name"
              required
            >

            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="What do you want to say?"
              required
            ></textarea>

            <p class="form-note">I aim to respond within two business days.</p>
            <p class="form-status" role="status" aria-live="polite"></p>

            <div class="button-group">
              <button class="btn" type="submit">Send Message</button>
            </div>

          </form>

        </div>

      </div>

    </section>

  </main>
